plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oguz.gorevler'
    compileSdk 35

    defaultConfig {
        applicationId "com.oguz.gorevler"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Fotoğraftaki yazıyı okumak için Google ML Kit — GÖMÜLÜ model:
    // tanıma tamamen telefonda yapılır, internet ya da Google Play indirmesi gerekmez.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
